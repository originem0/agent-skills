<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>word-family-video frame</title>
<style>
  :root {
    --bg: #f6f3ec; --card: #fff; --ink: #1e242b; --muted: #6b717a; --line: #e4dfd5;
    --pre: #b84a14; --pre-bg: #fdf0e6; --root: #176b4d; --root-bg: #e7f3ee;
    --suf: #5e6670; --suf-bg: #eef0f2; --accent: #2b5c8f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  /* 纸面质感：极淡的噪点，避免整片平涂显得像 PPT */
  body { color: var(--ink); line-height: 1.5; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 .07 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .p { color: var(--pre); } .r { color: var(--root); } .s { color: var(--suf); }
  #frame { position: relative; width: 1920px; height: 1080px; }
  .abs { position: absolute; }

  /* 分区：页眉 0–110；主区 120–840；家族条 860–905；字幕 930–1040 */
  .hd { left: 80px; top: 40px; display: flex; align-items: center; gap: 18px; }
  .badge { font-family: Georgia, serif; font-weight: 700; font-size: 34px; color: var(--root);
    background: var(--root-bg); padding: 2px 20px; border-radius: 12px; }
  .badge small { font-family: "Microsoft YaHei", sans-serif; font-size: 22px; margin-left: 10px; }
  .hd .t { color: var(--muted); font-size: 24px; }

  .pic .stage { background: #fbf9f4; border: 2px solid #e8e2d6; border-radius: 26px; padding: 20px 24px 12px;
    box-shadow: 0 18px 40px rgba(60, 50, 30, .10); }
  .pic .stage svg { display: block; width: 100%; height: auto; overflow: visible; }
  .pic .stage figcaption { font-size: 26px; color: var(--muted); text-align: center; margin-top: 6px; }

  .big { font-size: 64px; font-weight: 700; line-height: 1.25; white-space: pre-line; }
  .say { padding-left: 24px; border-left: 7px solid var(--accent); font-size: 34px; font-weight: 600; }
  .rootbig { display: inline-block; font-family: Georgia, serif; font-weight: 700; font-size: 100px; line-height: 1.2;
    color: var(--root); background: var(--root-bg); padding: 0 36px; border-radius: 22px; }
  .rootbig small { font-family: "Microsoft YaHei", sans-serif; font-size: 38px; margin-left: 18px; }
  .variants { font-family: Georgia, serif; font-size: 32px; font-weight: 700; color: var(--pre); }
  .variants b { font-family: "Microsoft YaHei", sans-serif; font-size: 26px; color: var(--muted); margin-right: 14px; }

  .link { font-size: 28px; color: var(--muted); font-style: italic; }
  .morph { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .chip { display: inline-flex; flex-direction: column; padding: 10px 26px; border-radius: 16px; background: var(--pre-bg); color: var(--pre); }
  .chip.r { background: var(--root-bg); color: var(--root); }
  .chip.s { background: var(--suf-bg); color: var(--suf); }
  .chip b { font-family: Georgia, serif; font-size: 46px; line-height: 1.15; }
  .chip small { font-size: 23px; }
  .chip .of { display: block; font-style: normal; font-size: 19px; opacity: .85; }
  .plus { font-size: 36px; color: var(--muted); font-weight: 700; }
  .word { font-family: Georgia, serif; font-weight: 700; font-size: 92px; line-height: 1.12; }
  .literal { font-size: 34px; color: var(--accent); font-weight: 700; }
  .meaning { font-size: 34px; font-weight: 700; }
  .ex { font-size: 26px; background: rgba(239, 236, 228, .9); border-radius: 14px; padding: 12px 20px; }
  .ex i { font-family: Georgia, serif; }
  .txt > * + * { margin-top: 22px; }
  .finale .word { color: var(--root); }

  /* 三种版式轮换：图右文左 / 图左文右 / 大字主角。每个版式给文字区一个最大高度，超了自动等比缩小 */
  .lay-a .txt { left: 110px; top: 160px; width: 760px; }
  .lay-a .pic { left: 920px; top: 200px; width: 900px; transform: rotate(.8deg); }
  .lay-b .pic { left: 100px; top: 210px; width: 900px; transform: rotate(-.8deg); }
  .lay-b .txt { left: 1080px; top: 160px; width: 740px; }
  .lay-c .txt { left: 110px; top: 140px; width: 800px; }
  .lay-c .word { font-size: 120px; }
  .lay-c .pic { left: 940px; top: 330px; width: 860px; transform: rotate(-1.2deg); }
  .lay-c .head { left: 940px; top: 150px; width: 860px; }

  .full { left: 160px; right: 160px; top: 200px; }
  .mid .txt { top: 300px; width: 690px; }
  .mid .pic { top: 230px; left: 860px; width: 980px; }
  .panel { background: var(--card); border: 2px solid var(--line); border-radius: 26px; padding: 40px 52px; font-size: 32px;
    box-shadow: 0 18px 40px rgba(60, 50, 30, .08); }
  .panel h2 { font-size: 36px; margin-bottom: 26px; color: var(--accent); }
  .panel p + p { margin-top: 24px; }
  .q { font-family: Georgia, serif; font-size: 44px; font-weight: 700; margin: 18px 0; }
  .q .ans { display: block; font-family: "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 600; color: var(--accent); }
  .src { font-size: 24px; color: var(--muted); }
  .polaroid { position: relative; background: #fff; padding: 18px 18px 14px; box-shadow: 0 22px 46px rgba(60, 50, 30, .16); transform: rotate(-1.6deg); }
  .polaroid .crop { overflow: hidden; height: 520px; }
  .polaroid img { display: block; width: 100%; height: 100%; object-fit: cover; transform-origin: 60% 50%; }
  .polaroid figcaption { font-size: 18px; color: var(--muted); margin-top: 10px; }
  .tape { position: absolute; top: -16px; width: 130px; height: 34px; background: rgba(232, 220, 190, .78); }
  .tape.l { left: 40px; transform: rotate(-6deg); } .tape.r { right: 40px; transform: rotate(5deg); }
  .mapbox { left: 250px; top: 110px; width: 1420px; }
  .mapbox svg { width: 100%; height: auto; }

  .strip { left: 110px; right: 110px; top: 862px; display: flex; gap: 14px; align-items: center; }
  .strip span { font-family: Georgia, serif; font-size: 26px; font-weight: 700; padding: 4px 18px; border-radius: 999px;
    border: 2px solid var(--line); color: #bdb8ae; background: rgba(255, 255, 255, .4); }
  .strip span.done { color: var(--ink); border-color: #d6d0c4; }
  .strip span.now { color: #fff; background: var(--pre); border-color: var(--pre); }
  .strip .lab { font-family: "Microsoft YaHei", sans-serif; font-size: 22px; color: var(--muted); border: none; background: none; padding: 0 6px 0 0; }

  .sub { left: 0; right: 0; top: 948px; text-align: center; }
  .sub span { display: inline-block; font-size: 42px; font-weight: 700; color: var(--ink); padding: 6px 30px;
    background: rgba(255, 255, 255, .78); border-radius: 14px; }
</style>
</head>
<body>
<div id="frame"></div>
<script>
/* 数据由 scripts/video.py 注入：{ lesson, units, subs, total, spoken } ——
   units[i] = { kind, idx?, layout?, t0, dur, lines: [{s, e, text}](相对本单元开头的秒), s2?, qn? } */
const DATA = /*__DATA_JSON__*/null;

/*__KIT_JS__*/

const L = DATA.lesson;
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const lineAt = (u, i, fb = 0) => (u.lines[i] ? u.lines[i].s : fb);

/* ---------------- 每个单元的 DOM。出场时机写在 data-at（秒，相对单元开头） ---------------- */
function stripHTML(cur) {
  const all = DATA.spoken.map(i => L.words[i]).concat(L.finale ? [L.finale] : []);
  return `<div class="abs strip"><span class="lab">${esc(L.root.m)} 一家</span>${all.map((w, i) =>
    `<span class="${i === cur ? "now" : i < cur ? "done" : ""}">${esc(w.w)}</span>`).join("")}</div>`;
}

function wordHTML(u, w, pos, finale) {
  const at2 = lineAt(u, u.s2, 2), atM = lineAt(u, u.s2 + 1, at2 + 0.8), atX = lineAt(u, u.lines.length - 1, atM + 0.8);
  const lay = u.layout || "lay-a";
  const head = `${w.link ? `<p class="link" data-at="0">${esc(w.link)}</p>` : ""}
      <div data-at="${Math.min(lineAt(u, 1, 0.8), at2) }">${chips(w.parts)}</div>`;
  const body = `<div class="word" data-at="${at2}">${colorWord(w.split)}</div>
      <p class="literal" data-at="${at2 + 0.35}">字面画面：${esc(w.literal)}</p>
      <p class="meaning" data-at="${atM}">${esc(w.meaning)}</p>
      ${w.ex ? `<p class="ex" data-at="${atX}"><i>${esc(w.ex[0])}</i><br>${esc(w.ex[1])}</p>` : ""}`;
  const pic = `<div class="abs pic" data-at="0.15" data-draw="0.45">${scene(w.scene, w.caption)}</div>`;
  if (lay === "lay-c")   // 大字主角：左边是大号单词和释义，右上是词素，右下是画面
    return `<div class="${lay} ${finale ? "finale" : ""}"><div class="abs head txt">${head}</div>
      <div class="abs txt fit" data-max="680">${body}</div>${pic}</div>${stripHTML(pos)}`;
  return `<div class="${lay} ${finale ? "finale" : ""}"><div class="abs txt fit" data-max="690">${head}${body}</div>${pic}</div>${stripHTML(pos)}`;
}

function unitHTML(u) {
  const o = L.opening, an = L.anchor;
  switch (u.kind) {
    case "opening": return `<div class="lay-a mid"><div class="abs txt fit" data-max="680">
        <div class="big" data-at="0">${esc(o.big.replace(/\s*·\s*/g, "\n"))}</div><p class="say" data-at="${lineAt(u, 1, 1)}">${esc(o.say)}</p>
        ${o.source ? `<p class="src" data-at="${lineAt(u, 1, 1)}">来源：${esc(o.source.title)}（${esc(o.source.date)}）</p>` : ""}</div>
        ${o.photo ? `<div class="abs pic" data-at="0.15"><figure class="polaroid"><i class="tape l"></i><i class="tape r"></i>
            <div class="crop"><img src="${o.photo.uri}"></div><figcaption>${esc(o.photo.credit)}</figcaption></figure></div>`
          : `<div class="abs pic" data-at="0.3" data-draw="0.6">${scene(o.scene, o.caption)}</div>`}</div>`;
    case "anchor": case "outro": {
      const vs = L.root.variants && L.root.variants.length;
      return `<div class="lay-a mid"><div class="abs txt fit" data-max="560">
        <span class="rootbig" data-at="0">${esc(L.root.m)}<small>${esc(L.root.cn)}</small></span>
        ${vs ? `<p class="variants" data-at="0.6"><b>变体</b>${esc(variantLine(L.root.variants))}</p>` : ""}
        <p class="say" data-at="${u.kind === "outro" ? 0.4 : lineAt(u, 0, 0.4)}">${esc(an.text)}</p></div>
        <div class="abs pic" data-at="0.2" data-draw="0.5">${scene(an.scene, an.caption)}</div></div>
        ${u.kind === "anchor" ? stripHTML(-1) : ""}`;
    }
    case "word": return wordHTML(u, L.words[u.idx], DATA.spoken.indexOf(u.idx), false);
    case "finale": return wordHTML(u, L.finale, DATA.spoken.length, true);
    case "map": return `<div class="abs mapbox" data-at="0">${familyMap(L)}</div>`;
    case "traps": return `<div class="abs full"><div class="panel" data-at="0"><h2>形近陷阱</h2>
        ${(L.traps || []).map((t, i) => `<p data-at="${lineAt(u, i, i * 2)}">${t}</p>`).join("")}</div></div>`;
    case "transfer": {
      const tr = L.transfer || [], qn = u.qn || 1;
      return `<div class="abs full"><div class="panel" data-at="0"><h2>同一个画面，你来推方向</h2>
        ${tr.map(([q, a], i) => `<div class="q" data-at="${lineAt(u, Math.min(1, qn - 1), 0.5) + 0.3 * i}">${esc(q)}
          <span class="ans" data-at="${lineAt(u, qn + i, lineAt(u, qn, 99))}">${esc(a.split(/[。；]/)[0])}</span></div>`).join("")}</div></div>`;
    }
  }
  return "";
}

/* ---------------- 线稿逐笔画出：先画线、后上色（思路借鉴 geeklee/srt-whiteboard-animation） ---------------- */
function prepDraw(root) {
  root.querySelectorAll("svg").forEach(svg => {
    const groups = [...svg.querySelectorAll(":scope > g[data-k]")];
    svg.__groups = groups.map(g => {
      const shapes = [...g.querySelectorAll("path, line, polyline, polygon, circle, ellipse, rect")].map(e => {
        const dashed = (e.getAttribute("stroke-dasharray") || "").trim() !== "";
        let len = 0;
        try { len = e.getTotalLength(); } catch (err) { }
        return { e, len, dashed, marker: e.getAttribute("marker-end") };
      });
      return { g, shapes, texts: [...g.querySelectorAll("text")] };
    });
  });
}
function applyDraw(root, p) {          // p: 0→1 整个画面的绘制进度
  let busy = false;
  root.querySelectorAll("svg").forEach(svg => {
    const gs = svg.__groups || [], n = Math.max(gs.length, 1);
    gs.forEach((G, i) => {
      const a = (i / n) * 0.65, q = clamp((p - a) / 0.35);       // 每个零件依次开画，彼此有重叠
      if (q > 0 && q < 1) busy = true;
      G.shapes.forEach(S => {
        if (S.dashed || !S.len) { S.e.style.opacity = ease(q); return; }
        S.e.style.strokeDasharray = S.len;
        S.e.style.strokeDashoffset = S.len * (1 - ease(Math.min(1, q / 0.75)));
        S.e.style.fillOpacity = clamp((q - 0.55) / 0.45);           // 线条画完一大半才上色
        if (S.marker) { if (q < 0.97) S.e.removeAttribute("marker-end"); else S.e.setAttribute("marker-end", S.marker); }
      });
      G.texts.forEach(t => t.style.opacity = clamp((q - 0.6) / 0.4));
    });
  });
  return busy;
}

/* ---------------- 逐帧入口：python 每帧调用 setT(t)，返回是否需要重新截图 ---------------- */
let cur = -1, root = null, lastSub = null;
const frame = document.getElementById("frame");
function setT(t) {
  let ui = DATA.units.findIndex(u => t < u.t0 + u.dur);
  if (ui < 0) ui = DATA.units.length - 1;
  const u = DATA.units[ui], lt = t - u.t0;
  let changed = false;
  if (ui !== cur) {
    frame.innerHTML = `<div class="abs hd"><span class="badge">${esc(L.root.m)}<small>${esc(L.root.cn)}</small></span><span class="t">${esc(L.title)}</span></div>
      <div id="unit">${unitHTML(u)}</div><div class="abs sub"><span id="sub"></span></div>`;
    root = document.getElementById("unit");
    root.querySelectorAll(".fit").forEach(el => {          // 文字区超高时等比缩小，不压到家族条
      const max = +el.dataset.max || 680, h = el.scrollHeight;
      if (h > max) el.style.zoom = (max / h).toFixed(3);
    });
    prepDraw(root);
    cur = ui; changed = true; lastSub = null;
  }
  let busy = false;
  root.querySelectorAll("[data-at]").forEach(el => {
    const at = +el.dataset.at, p = clamp((lt - at) / 0.45);
    if (p > 0 && p < 1) busy = true;
    el.style.opacity = ease(p);
    el.style.translate = `0 ${(1 - ease(p)) * 26}px`;
    if (el.dataset.draw != null) {
      const dp = clamp((lt - (+el.dataset.at) - (+el.dataset.draw)) / 1.8);
      if (applyDraw(el, dp)) busy = true;
    }
  });
  // 开场照片：整段缓慢推近，像镜头在看这张照片
  const ph = root.querySelector(".polaroid img");
  if (ph) { ph.style.transform = `scale(${(1 + 0.08 * clamp(lt / u.dur)).toFixed(4)})`; busy = true; }
  // 家族图：节点按解说逐个点亮（python 给出每个词出现的时刻）
  if (u.kind === "map") {
    const svg = root.querySelector(".mapbox svg");
    const nodes = [...svg.querySelectorAll("[data-node]")];
    nodes.forEach(nd => {
      const at = (u.nodeAt || {})[nd.dataset.node] ?? 0.3 + 0.25 * nd.dataset.node, p = clamp((lt - at) / 0.4);
      if (p > 0 && p < 1) busy = true;
      nd.style.opacity = 0.12 + 0.88 * ease(p);
    });
  }
  const s = DATA.subs.find(x => t >= x.s && t < x.e);
  const st = s ? s.t : "";
  if (st !== lastSub) { document.getElementById("sub").textContent = st; document.getElementById("sub").parentElement.style.opacity = st ? 1 : 0; lastSub = st; changed = true; }
  return changed || busy;
}
window.setT = setT;
</script>
</body>
</html>
