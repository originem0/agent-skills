<!doctype html>
<html lang="zh-CN">

<title>词族 · 分镜</title>
<style>
  :root { --ink:#24343c; --root:#356857; --muted:#677981; --paper:#f6f8f7; --line:#d8e0df;
    --en:"Sitka Display",Cambria,Georgia,serif; --zh:"Microsoft YaHei","Noto Sans SC",sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; }
  body { background:var(--paper); color:var(--ink); font-family:var(--zh); }
  #mast { position:absolute; left:84px; right:84px; top:38px; height:62px; display:flex; align-items:flex-start;
    justify-content:space-between; gap:28px; border-bottom:1px solid var(--line); font-size:26px; color:var(--muted); }
  #family { font-family:var(--en); color:var(--root); flex-shrink:0; white-space:nowrap; }
  #chapter { max-width:38%; text-align:right; flex-shrink:0; font-size:24px; white-space:nowrap; }
  #words { display:flex; flex:1; min-width:0; gap:20px; align-items:center; overflow:hidden; height:53px; }
  #words[hidden] { display:none; }
  #words .word { flex-shrink:0; white-space:nowrap; font-family:var(--en); font-size:28px;
    font-weight:500; color:var(--muted); padding:0 0 7px; border-bottom:3px solid transparent; }
  #words .word.now { color:var(--ink); border-bottom-color:#38667f; }
  #words .more { flex-shrink:0; width:20px; font-size:24px; color:var(--muted); }
  .shot { position:absolute; inset:0; visibility:hidden; }
  .shot.on { visibility:visible; }
  .node { position:absolute; transform-origin:50% 50%; }
  .text { display:flex; align-items:center; line-height:1.22; white-space:pre-wrap; overflow-wrap:normal; }
  .text .ink { display:block; max-width:100%; }
  .photo { overflow:hidden; }
  .photo img { display:block; width:100%; height:100%; }
  .illustration .cam,.illustration figure { width:100%; height:100%; }
  .illustration svg,.shape svg,.line svg { width:100%; height:100%; display:block; overflow:visible; }
  figcaption { display:none; }
  #credits { position:absolute; left:84px; right:84px; top:935px; height:32px; font-size:17px; color:var(--muted);
    display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; }
  #sub { position:absolute; left:84px; right:84px; top:980px; height:78px; display:flex; align-items:center;
    justify-content:center; text-align:center; font-size:42px; font-weight:600; line-height:1.3; }
</style>
